version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      actions:
        patterns:
          - '*'
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10

  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/signon-mock'
    schedule:
      interval: 'monthly'
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    cooldown:
      default-days: 3
    allow:
      - dependency-type: direct
    open-pull-requests-limit: 10

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      docker:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    cooldown:
      default-days: 10
    open-pull-requests-limit: 10
