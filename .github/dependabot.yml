version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/signon-mock'
    schedule:
      interval: 'weekly'
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      docker:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
