name: Release & Deploy

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'signon-mock/**'
      - 'cypress/**'
      - 'cypress*'
      - 'jest*'
      - '.prettier*'
      - '.eslint*'
      - '.gitignore'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag_gen.outputs.tag }}
      short_sha: ${{ steps.tag_gen.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate Release Tag Name
        id: tag_gen
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG=$(date +v%Y.%m.%d)-${SHORT_SHA}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag_gen.outputs.tag }}
        run: |
          gh release create "$TAG" --title "Release $TAG" --generate-notes

  deploy-staging:
    needs: create-release
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run clean-build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy govuk-knowledge-graph-search \
            --source . \
            --region "europe-west2" \
            --tag "main-${{ needs.create-release.outputs.short_sha }}" \
            --no-traffic \
            --project ${{ vars.GCP_PROJECT_ID }}

      - name: Route Traffic to New Revision
        run: |
          gcloud run services update-traffic govuk-knowledge-graph-search \
            --to-tags "main-${{ needs.create-release.outputs.short_sha }}=100" \
            --region "europe-west2" \
            --project ${{ vars.GCP_PROJECT_ID }}

  deploy-production:
    needs: [create-release, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run clean-build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy govuk-knowledge-graph-search \
            --source . \
            --region "europe-west2" \
            --tag "main-${{ needs.create-release.outputs.short_sha }}" \
            --no-traffic \
            --project ${{ vars.GCP_PROJECT_ID }}

      - name: Route Traffic to New Revision
        run: |
          gcloud run services update-traffic govuk-knowledge-graph-search \
            --to-tags "main-${{ needs.create-release.outputs.short_sha }}=100" \
            --region "europe-west2" \
            --project ${{ vars.GCP_PROJECT_ID }}
